name: probe
on:
  push:
    branches: [port-26.3]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: NeoForge versions
        run: |
          curl -s https://maven.neoforged.net/api/maven/versions/releases/net/neoforged/neoforge | python3 -c "
          import sys,json
          v=json.load(sys.stdin)['versions']
          print('total',len(v))
          print('26.x:',[x for x in v if x.startswith('26')][-60:])
          print('last:',v[-15:])"
      - name: ModDevGradle versions
        run: |
          curl -s https://plugins.gradle.org/m2/net/neoforged/moddev/net.neoforged.moddev.gradle.plugin/maven-metadata.xml | grep -E "<version>|latest|release" | tail -8

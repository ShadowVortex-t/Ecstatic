name: build
on:
  workflow_dispatch:
  push:
    branches: [port-26.3]
    paths-ignore: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile
        continue-on-error: true
        run: ./gradlew compileJava --no-daemon --stacktrace > build.log 2>&1
      - name: Build jar
        continue-on-error: true
        run: ./gradlew build --no-daemon > jar.log 2>&1
      - name: Collect reference sources
        continue-on-error: true
        run: |
          mkdir -p out
          cp build.log out/ 2>/dev/null; cp jar.log out/ 2>/dev/null
          cp build/libs/*.jar out/ 2>/dev/null
          find / -name "*.jar" \( -iname "*sources*" -o -iname "*neoforge*" -o -iname "*minecraft*" \) -size +1M 2>/dev/null | grep -v "/usr/lib/jvm" > out/jars.txt
          mkdir -p srcx
          for j in $(grep -i sources out/jars.txt); do (cd srcx && unzip -qo "$j" 'com/mojang/blaze3d/*' 'net/minecraft/client/renderer/*' 'net/minecraft/client/Camera.java' 'net/minecraft/client/KeyMapping.java' 'net/neoforged/neoforge/client/*' 'net/minecraft/resources/*' 'net/minecraft/client/gui/screens/*' 2>/dev/null); done
          tar czf out/refsrc.tar.gz -C srcx . 2>/dev/null
          ls -la out >> out/jars.txt
      - name: Publish results branch
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git checkout --orphan ci-output-build
          git rm -rf . >/dev/null 2>&1 || true
          cp -r out/. .
          git add -A
          git commit -qm "build results ${GITHUB_SHA}"
          git push -f origin ci-output-build
